[project]
name = "ai-lie-game"
version = "0.1.0"
description = "AIウソ発見ゲーム：AIのウソをみやぶったり、AIをだましたりして遊ぶGradioアプリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "gradio>=4.44",
    "python-dotenv>=1.0",
]

[project.scripts]
# `uv run ai-lie-game` でゲームを起動できる
ai-lie-game = "ai_lie_game.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_lie_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
